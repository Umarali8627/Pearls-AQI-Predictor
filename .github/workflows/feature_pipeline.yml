name: Feature Pipeline

on:
  schedule:
    # Runs at minute 0 of every hour (UTC). GitHub may delay a scheduled
    # run by a few minutes during periods of high load -- that's normal.
    - cron: "0 * * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

# Prevent two feature-pipeline runs from overlapping if one is still
# running when the next hourly trigger fires.
concurrency:
  group: feature-pipeline
  cancel-in-progress: false

jobs:
  run-feature-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run feature pipeline
        env:
          HOPSWORKS_PROJECT: ${{ secrets.HOPSWORKS_PROJECT }}
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          # Add any additional secrets your feature pipeline needs, e.g.:
          # AQI_API_KEY: ${{ secrets.AQI_API_KEY }}
        run: python src/pipelines/feature_pipeline.py

      - name: Upload run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feature-pipeline-logs-${{ github.run_id }}
          path: logs/
          retention-days: 14
          if-no-files-found: ignore