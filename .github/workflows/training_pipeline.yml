name: Train Pipeline

on:
  schedule:
    # Once a day at 02:15 UTC -- a few minutes after an hourly feature run,
    # so training sees fresh features. Adjust the hour to suit your timezone.
    - cron: "15 2 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

# Prevent two training runs from overlapping.
concurrency:
  group: train-pipeline
  cancel-in-progress: false

jobs:
  run-train-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.7"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run training pipeline
        env:
          HOPSWORKS_PROJECT: ${{ secrets.HOPSWORKS_PROJECT }}
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
        run:  python -m src.pipelines.training_pipeline

      - name: Upload run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: train-pipeline-logs-${{ github.run_id }}
          path: logs/
          retention-days: 30
          if-no-files-found: ignore
