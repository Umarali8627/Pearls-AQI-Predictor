[project]
name = "pearls-aqi-predictor"
version = "1.0.0"
description = "FastAPI backend for real-time AQI data and multi-horizon AQI forecasting"
requires-python = ">=3.11,<3.12"

dependencies = [
    "fastapi[standard]",
    
    "numpy==1.26.4",
    "pandas==2.3.3",
    "scikit-learn==1.9.0",
    "joblib==1.5.3",
    "tensorflow",

    "hopsworks",
    "protobuf",
    "pyarrow==25.0.0",
    "confluent-kafka==2.13.2",

    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "python-dotenv==1.2.2",

    "requests==2.34.2",
    "httpx==0.28.1",

    "python-multipart==0.0.32",
    "email-validator==2.3.0"
]

[tool.fastapi]
entrypoint = "main:app"